name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: pip install pytest
      - name: Run Python engine tests
        run: pytest -v

  typescript-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Typecheck and test TypeScript client
        working-directory: ts
        run: |
          npm install --no-package-lock
          npm run build
          npm test
